name: Build

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        postgres_version: [17, 18, 19]
        include:
          - postgres_version: 19
            is_latest: true

    env:
      POSTGRES_VERSION: ${{ matrix.postgres_version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=pg${{ matrix.postgres_version }}-{{date 'YYYYMMDD'}}
            type=raw,value=latest,enable=${{ matrix.is_latest == true && github.ref == 'refs/heads/main' }}

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: pg-backup-s3:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            POSTGRES_VERSION=${{ matrix.postgres_version }}

      - name: Test plain backup
        run: docker compose -f test/compose.yaml run --rm verify

      - name: Test encrypted backup
        env:
          ENCRYPTION_PASSWORD: ci-test-password
        run: |
          docker compose -f test/compose.yaml down -v
          docker compose -f test/compose.yaml run --rm verify

      - name: Show test logs
        if: failure()
        run: docker compose -f test/compose.yaml logs

      - name: Clean up tests
        if: always()
        run: docker compose -f test/compose.yaml down -v

      - name: Push Docker image
        id: build-and-push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            POSTGRES_VERSION=${{ matrix.postgres_version }}
