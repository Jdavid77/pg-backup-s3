name: Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        postgres_version: [16, 17, 18, 19]
        encryption: [false, true]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Back up and verify
        env:
          POSTGRES_VERSION: ${{ matrix.postgres_version }}
        run: |
          # leave ENCRYPTION_PASSWORD unset for the plain run, as the CronJobs do
          if [ "${{ matrix.encryption }}" = "true" ]; then
            export ENCRYPTION_PASSWORD=ci-test-password
          fi
          docker compose -f test/compose.yaml run --rm --build verify

      - name: Show logs
        if: failure()
        run: docker compose -f test/compose.yaml logs

      - name: Clean up
        if: always()
        run: docker compose -f test/compose.yaml down -v
